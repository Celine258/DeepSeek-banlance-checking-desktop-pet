<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>DeepSeek 桌宠 · 设置</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <style>
      :root {
        color-scheme: light;
        --paper: #fffcf5;
        --ink: #171a22;
        --muted: #7c8290;
        --accent: #4d6bfe;
        --warn: #e5484d;
        --ok: #12a150;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #f5f6fa;
        color: var(--ink);
        font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "PingFang SC",
          system-ui, sans-serif;
        font-size: 13px;
        padding: 22px 24px 18px;
        line-height: 1.55;
        -webkit-user-select: none;
        user-select: none;
      }

      h1 {
        font-size: 15px;
        font-weight: 650;
        letter-spacing: 0.01em;
        margin-bottom: 4px;
      }

      .lede {
        color: var(--muted);
        margin-bottom: 18px;
      }

      label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
      }

      .field {
        position: relative;
        display: flex;
        align-items: center;
        background: var(--paper);
        border: 1.5px solid rgba(23, 26, 34, 0.7);
        border-radius: 9px;
        overflow: hidden;
      }

      .field:focus-within {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(77, 107, 254, 0.16);
      }

      input[type="password"],
      input[type="text"] {
        flex: 1;
        border: 0;
        outline: 0;
        background: transparent;
        padding: 9px 12px;
        font: inherit;
        font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
        font-size: 12.5px;
        color: var(--ink);
        -webkit-user-select: text;
        user-select: text;
      }

      .reveal {
        border: 0;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 12px;
        padding: 0 12px;
        height: 100%;
        cursor: pointer;
      }

      .reveal:hover {
        color: var(--accent);
      }

      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 16px;
      }

      button.primary,
      button.ghost {
        font: inherit;
        font-weight: 600;
        border-radius: 8px;
        padding: 8px 18px;
        cursor: pointer;
        border: 1.5px solid transparent;
      }

      button.primary {
        background: var(--accent);
        color: #fff;
      }

      button.primary:hover {
        background: #3f5cf0;
      }

      button.ghost {
        background: transparent;
        border-color: rgba(23, 26, 34, 0.35);
        color: var(--ink);
      }

      button.ghost:hover {
        border-color: var(--ink);
      }

      button:disabled {
        opacity: 0.55;
        cursor: default;
      }

      .status {
        margin-left: auto;
        font-size: 12px;
        color: var(--muted);
        text-align: right;
        max-width: 55%;
      }

      .status.is-ok {
        color: var(--ok);
      }

      .status.is-error {
        color: var(--warn);
      }

      .foot {
        margin-top: 20px;
        padding-top: 12px;
        border-top: 1px solid rgba(23, 26, 34, 0.1);
        color: var(--muted);
        font-size: 11.5px;
      }

      .foot a {
        color: var(--accent);
        text-decoration: none;
      }

      .foot a:hover {
        text-decoration: underline;
      }

      .foot code {
        font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
        font-size: 11px;
        color: var(--ink);
        opacity: 0.75;
        -webkit-user-select: text;
        user-select: text;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <h1>连接 DeepSeek</h1>
    <p class="lede">填上 API Key，左键点一下桌宠就能看到余额。</p>

    <label for="api-key">API Key</label>
    <div class="field">
      <input id="api-key" type="password" placeholder="sk-..." spellcheck="false" autocomplete="off" />
      <button id="reveal" class="reveal" type="button">显示</button>
    </div>

    <div class="row">
      <button id="save" class="primary" type="button">保存</button>
      <button id="test" class="ghost" type="button">测试连接</button>
      <span id="status" class="status"></span>
    </div>

    <p class="foot">
      还没有 Key？到
      <a id="key-link" href="#">DeepSeek 开放平台 → API keys</a>
      新建一个。Key 只写在你本机的配置文件里，不会发到别的地方：<br />
      <code id="config-path"></code>
    </p>

    <script src="settings.js"></script>
  </body>
</html>
